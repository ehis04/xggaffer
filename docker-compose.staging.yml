services:
  db:
    image: postgres:16
    container_name: xggaffer_staging_db
    env_file:
      - ./build/backend/.env.staging
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xggaffer_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: xggaffer_staging_redis
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./build/backend
    container_name: xggaffer_staging_backend
    env_file:
      - ./build/backend/.env.staging
    volumes:
      - backend_staticfiles:/app/staticfiles
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
            python manage.py collectstatic --noinput &&
            exec gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 backend.wsgi:application"
    restart: unless-stopped

  celery_worker:
    build:
      context: ./build/backend
    container_name: xggaffer_staging_celery_worker
    env_file:
      - ./build/backend/.env.staging
    volumes:
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A backend worker
      --loglevel=info
      -Q celery,queue_football_data,queue_understat,queue_sofascore,queue_whoscored,queue_transfermarkt,queue_native_stats,queue_publication
    restart: unless-stopped

  celery_beat:
    build:
      context: ./build/backend
    container_name: xggaffer_staging_celery_beat
    env_file:
      - ./build/backend/.env.staging
    volumes:
      - celerybeat_staging_data:/app/celerybeat-data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A backend beat
      --loglevel=info
      --schedule=/app/celerybeat-data/celerybeat-schedule
    restart: unless-stopped

  frontend:
    build:
      context: ./build/web-frontend
      dockerfile: Dockerfile.staging
      args:
        VITE_API_BASE_URL: /api
    container_name: xggaffer_staging_frontend
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: xggaffer_staging_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_staticfiles:/var/www/static:ro
      - backend_media:/var/www/media:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_staging_data:
  redis_staging_data:
  backend_staticfiles:
  backend_media:
  celerybeat_staging_data: