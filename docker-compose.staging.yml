name: xggaffer

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-environment: &backend-environment
  DJANGO_SETTINGS_MODULE: backend.settings_production
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.staging}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.staging}@db:5432/xggaffer
  REDIS_URL: redis://redis:6379/0
  CACHE_REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-xggaffer.site,www.xggaffer.site}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://xggaffer.site,https://www.xggaffer.site}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://xggaffer.site,https://www.xggaffer.site}
  FRONTEND_URL: ${FRONTEND_URL:-https://xggaffer.site}
  XGGAFFER_DATA_DIR: /app/data
  CLUB_RESOURCES_USE_CLOUDINARY: ${CLUB_RESOURCES_USE_CLOUDINARY:-False}
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
  FOOTBALL_DATA_API_TOKEN: ${FOOTBALL_DATA_API_TOKEN:-}
  THE_ODDS_API_KEY: ${THE_ODDS_API_KEY:-}
  ODDS_API_ENABLED: ${ODDS_API_ENABLED:-False}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-xgGaffer <noreply@xggaffer.site>}
  ENABLE_CELERY_BEAT_SCHEDULE: ${ENABLE_CELERY_BEAT_SCHEDULE:-True}

x-backend-service: &backend-service
  build:
    context: ./src/backend
  environment: *backend-environment
  logging: *default-logging
  restart: unless-stopped

services:
  db:
    image: postgres:16
    logging: *default-logging
    environment:
      POSTGRES_DB: xggaffer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.staging}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xggaffer"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    logging: *default-logging
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *backend-service
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput"
    volumes:
      - backend_staticfiles:/app/staticfiles
      - backend_media:/app/media
      - ${DATA_HOST_PATH:-./src/data}:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-service
    volumes:
      - backend_staticfiles:/app/staticfiles
      - backend_media:/app/media
      - ${DATA_HOST_PATH:-./src/data}:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          host = os.environ["ALLOWED_HOSTS"].split(",")[0].strip();
          request = urllib.request.Request("http://127.0.0.1:8000/health/ready/",
          headers={"Host": host, "X-Forwarded-Proto": "https"});
          urllib.request.urlopen(request, timeout=5)
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 30s

  celery_worker:
    <<: *backend-service
    profiles: ["background"]
    command: >
      celery -A backend worker --loglevel=info --concurrency=1
      --max-tasks-per-child=50 --max-memory-per-child=500000
      -Q celery,queue_football_data,queue_understat,queue_sofascore,
      queue_whoscored,queue_transfermarkt,queue_native_stats,queue_publication
    volumes:
      - backend_media:/app/media
      - ${DATA_HOST_PATH:-./src/data}:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  celery_beat:
    <<: *backend-service
    profiles: ["background"]
    command: >
      celery -A backend beat --loglevel=info
      --schedule=/app/celerybeat-data/celerybeat-schedule
    volumes:
      - ${DATA_HOST_PATH:-./src/data}:/app/data
      - celerybeat_data:/app/celerybeat-data
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./src/web-frontend
      dockerfile: Dockerfile.staging
      args:
        VITE_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  gateway:
    image: caddy:2-alpine
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-xggaffer.site}
      WWW_DOMAIN: ${WWW_DOMAIN:-www.xggaffer.site}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - backend_staticfiles:/srv/static:ro
      - backend_media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_staticfiles:
  backend_media:
  celerybeat_data:
  caddy_data:
  caddy_config:
