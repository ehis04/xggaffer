workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "Development"'
    - when: never

stages:
  - frontend
  - backend

variables:
  PYTHONUNBUFFERED: "1"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  NODE_ENV: "test"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/
    - src/web-frontend/node_modules/

frontend_check:
  stage: frontend
  image: node:20
  before_script:
    - cd src/web-frontend
    - npm ci
  script:
    - npx tsc --noEmit
    - npm run build
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - src/web-frontend/dist/

backend_check:
  stage: backend
  image: python:3.11
  services:
    - name: postgres:16
      alias: postgres
    - name: redis:7
      alias: redis
  variables:
    POSTGRES_DB: app_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_HOST_AUTH_METHOD: trust

    DB_NAME: app_test
    DB_USER: postgres
    DB_PASSWORD: postgres
    DB_HOST: postgres
    DB_PORT: "5432"

    DATABASE_URL: "postgres://postgres:postgres@postgres:5432/app_test"
    REDIS_URL: "redis://redis:6379/0"
    SECRET_KEY: "ci-development-test-secret-key"
    DEBUG: "False"
    ALLOWED_HOSTS: "localhost,127.0.0.1"

    CLUB_RESOURCES_USE_CLOUDINARY: "False"
  before_script:
    - cd src/backend
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python manage.py check
    - python manage.py makemigrations --check --dry-run
    - python manage.py migrate --noinput
    - python manage.py test